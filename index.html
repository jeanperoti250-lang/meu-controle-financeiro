<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7fb"><title>Meu Controle Financeiro 2.0</title><style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#17233c;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e6eaf2;padding:20px max(18px,calc((100vw - 980px)/2));}h1{font-size:23px;margin:0}h2{font-size:20px;margin:6px 0 18px}h3{font-size:16px;margin:10px 0}.muted{color:#65728a;font-size:13px}.wrap{max-width:980px;margin:auto;padding:18px 14px 95px}.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 0}.tabs button{white-space:nowrap}.tab.active{background:#2459dc;color:white;border-color:#2459dc}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}.card{background:#fff;border:1px solid #e7ebf3;border-radius:17px;padding:17px;margin-bottom:12px;box-shadow:0 2px 10px #142d5b07}.value{font-size:23px;font-weight:750;margin-top:8px}.green{color:#12815b}.red{color:#c43d52}.blue{color:#2459dc}button,input,select{font:inherit}button{background:#fff;border:1px solid #d9e1ed;border-radius:11px;padding:11px 13px;color:#253956;cursor:pointer}button.primary{background:#2459dc;color:#fff;border-color:#2459dc}button.danger{color:#b8324b;border-color:#f0c8d0}input,select{width:100%;padding:12px;border:1px solid #d9e1ed;border-radius:10px;background:#fff;min-width:0}label{font-size:13px;color:#56647b;display:block;margin-bottom:5px}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.field{min-width:0}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #edf0f5}.row:last-child{border:0}.row>div{min-width:0}.row small{color:#64728a;display:block;margin-top:4px}.progress{height:9px;border-radius:9px;background:#e8edf7;overflow:hidden;margin:10px 0}.progress>div{height:100%;background:#2459dc}.hidden{display:none!important}.note{background:#edf4ff;border-radius:12px;padding:12px;font-size:13px;color:#345078;margin-bottom:12px}.pill{display:inline-block;border-radius:12px;background:#eaf0fc;padding:4px 9px;font-size:12px}.bar{display:flex;align-items:center;gap:10px;margin:10px 0}.bar>span{width:105px;font-size:12px;overflow:hidden;text-overflow:ellipsis}.bar>div{flex:1;background:#e9eef7;border-radius:8px;height:12px;overflow:hidden}.bar i{display:block;background:#5381eb;height:100%}footer{font-size:12px;color:#73809a;text-align:center;padding:15px}@media(max-width:500px){.value{font-size:20px}.wrap{padding:12px 12px 75px}.card{padding:14px}}
</style></head><body><header><h1>💙 Meu Controle Financeiro</h1><div class="muted">Pessoal • Versão 2.0 • Dados neste navegador</div></header><main class="wrap"><nav class="tabs" id="tabs"></nav><section id="view"></section><footer>Gratuito • Sem conexão com bancos • Faça backups regularmente</footer></main><script>
(()=>{'use strict';const KEY='meu_financeiro_v2';const $=s=>document.querySelector(s);const money=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const today=()=>new Date().toLocaleDateString('en-CA');const ym=d=>String(d||today()).slice(0,7);const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=v=>Math.round((Number(v)||0)*100)/100;const initial=()=>({salary:0,payday:10,accounts:[],cards:[],transactions:[],recurring:[],goals:[],month:ym(today())});let data;try{data=JSON.parse(localStorage.getItem(KEY))||initial()}catch{data=initial()}for(const [k,v] of Object.entries(initial()))if(data[k]===undefined)data[k]=v;let imported=0;try{if(!localStorage.getItem(KEY)){let old=JSON.parse(localStorage.getItem('financas')||'[]');if(Array.isArray(old)){for(const x of old){if(!Number.isFinite(Number(x.valor))||Number(x.valor)<=0)continue;data.transactions.push({id:uid(),type:x.tipo==='Receita'?'income':'expense',desc:String(x.descricao||'Registro antigo'),amount:num(x.valor),date:today(),account:'',category:'Importado',legacy:true});imported++}}}}catch{}const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch{alert('Não foi possível salvar. Exporte um backup e libere espaço no navegador.')}};if(imported)save();let tab='inicio';const monthTitle=m=>new Date(m+'-01T12:00:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'});const inMonth=t=>ym(t.date)===data.month;const monthTx=()=>data.transactions.filter(inMonth);const inc=()=>monthTx().filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0);const exp=()=>monthTx().filter(x=>x.type==='expense'||x.type==='card').reduce((s,x)=>s+x.amount,0);const accountBalance=id=>{let a=data.accounts.find(x=>x.id===id);if(!a)return 0;return num(a.opening+data.transactions.reduce((s,t)=>s+(t.account===id?(t.type==='income'?t.amount:t.type==='expense'?-t.amount:t.type==='transfer_out'?-t.amount:t.type==='transfer_in'?t.amount:t.type==='card_payment'?-t.amount:0):0),0))};const cardSpent=id=>data.transactions.filter(x=>x.card===id&&x.type==='card').reduce((s,x)=>s+x.amount,0);const datefmt=d=>d?d.split('-').reverse().join('/'):'';const options=(arr,blank='Selecione')=>`<option value="">${blank}</option>`+arr.map(x=>`<option value="${safe(x.id)}">${safe(x.name)}</option>`).join('');const field=(label,html)=>`<div class="field"><label>${label}</label>${html}</div>`;const input=(id,placeholder,type='text',extra='')=>`<input id="${id}" type="${type}" placeholder="${placeholder}" ${extra}>`;const btn=(name,action,cl='')=>`<button class="${cl}" data-action="${action}">${name}</button>`;const card=(html)=>`<article class="card">${html}</article>`;const row=(main,sub,right,remove)=>`<div class="row"><div><strong>${main}</strong><small>${sub}</small></div><div style="text-align:right">${right} ${remove||''}</div></div>`;const del=(kind,id)=>`<button class="danger" data-del="${kind}" data-id="${safe(id)}" title="Excluir">✕</button>`;
function nextPay(){const now=new Date(),y=now.getFullYear(),m=now.getMonth(),day=Math.max(1,Math.min(28,Number(data.payday)||10));let next=new Date(y,m,day);if(next<=new Date(y,m,now.getDate()))next=new Date(y,m+1,day);return {date:next,days:Math.max(1,Math.ceil((next-new Date(y,m,now.getDate()))/86400000))}}
function home(){const total=data.accounts.reduce((s,a)=>s+accountBalance(a.id),0);const goalMonthly=data.goals.reduce((s,g)=>s+(g.monthly||0),0);const fixed=data.recurring.reduce((s,r)=>s+r.amount,0);const pay=nextPay();const available=Math.max(0,total-fixed-goalMonthly);return `<div class="actions"><h2 style="flex:1">Resumo de ${monthTitle(data.month)}</h2><input style="width:165px" id="month" type="month" value="${data.month}"></div>${imported?`<div class="note">Importamos ${imported} registro(s) antigos com a data de hoje. Confira as datas e faça um backup.</div>`:''}<div class="grid">${card(`<div class="muted">Saldo nas contas</div><div class="value blue">${money(total)}</div>`)}${card(`<div class="muted">Receitas no mês</div><div class="value green">${money(inc())}</div>`)}${card(`<div class="muted">Despesas no mês*</div><div class="value red">${money(exp())}</div>`)}${card(`<div class="muted">Resultado do mês</div><div class="value">${money(inc()-exp())}</div>`)}</div>${card(`<h3>📅 Próximo salário: ${datefmt(pay.date.toLocaleDateString('en-CA'))}</h3><div class="muted">Dia ${data.payday} • Salário cadastrado: ${money(data.salary)} • ${pay.days} dia(s) restantes</div><div class="value blue">${money(available/pay.days)} / dia</div><div class="muted">Estimativa: saldo atual − despesas fixas cadastradas − reserva mensal das metas, dividido pelos dias até o salário. Ajuste as reservas para não contar valores já pagos.</div>`)}${card(`<h3>⚡ Registrar movimentação</h3>${transactionForm()}`)}${card(`<h3>Últimos lançamentos</h3>${listTransactions(data.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5))}`)}<div class="note">*Compras no cartão contam como despesas na data da compra. O pagamento da fatura reduz o saldo bancário, sem gerar nova despesa. O saldo bancário não diminui na compra do cartão.</div>`}
function transactionForm(){return `<form id="txForm"><div class="form">${field('Tipo',`<select id="txType"><option value="expense">Despesa</option><option value="income">Receita</option><option value="card">Compra no cartão</option><option value="transfer">Transferência</option><option value="card_payment">Pagamento de fatura</option></select>`)}${field('Descrição',input('txDesc','Ex.: mercado','text','required'))}${field('Valor (R$)',input('txAmount','0,00','number','min="0.01" step="0.01" required'))}${field('Data',input('txDate','','date',`value="${today()}" required`))}${field('Categoria',`<select id="txCategory">${['Alimentação','Moradia','Transporte','Saúde','Lazer','Compras','Educação','Salário','Outros'].map(x=>`<option>${x}</option>`).join('')}</select>`)}${field('Conta de origem / destino',`<select id="txAccount">${options(data.accounts,'Sem conta vinculada')}</select>`)}${field('Conta de destino (transferência)',`<select id="txDest">${options(data.accounts)}</select>`)}${field('Cartão',`<select id="txCard">${options(data.cards)}</select>`)}</div><div class="actions"><button class="primary" type="submit">+ Adicionar</button></div></form>`}
function listTransactions(items){return items.length?items.map(t=>row(safe(t.desc),`${datefmt(t.date)} • ${safe(t.category||t.type)}${t.legacy?' • Importado':''}`,`<strong class="${t.type==='income'?'green':t.type==='transfer_in'?'blue':'red'}">${t.type==='income'?'+':'−'} ${money(t.amount)}</strong>`,del('transactions',t.id))).join(''):'<p class="muted">Nenhuma movimentação ainda.</p>'}
function movements(){return `<h2>💸 Movimentações</h2>${card(transactionForm())}${card(`<h3>Histórico • ${monthTitle(data.month)}</h3><input type="month" id="month" value="${data.month}" style="max-width:190px">${listTransactions(monthTx().slice().sort((a,b)=>b.date.localeCompare(a.date)))}`)}`}
function accounts(){return `<h2>🏦 Contas e dinheiro</h2>${card(`<h3>Adicionar conta</h3><form id="accountForm"><div class="form">${field('Nome',input('aName','Ex.: Nubank','text','required'))}${field('Saldo inicial',input('aOpening','0,00','number','step="0.01" required'))}</div><div class="actions"><button class="primary">Adicionar conta</button></div></form>`)}${data.accounts.map(a=>card(row(safe(a.name),'Saldo atualizado',`<strong class="blue">${money(accountBalance(a.id))}</strong>`,del('accounts',a.id)))).join('')||card('<p class="muted">Cadastre uma conta para acompanhar o saldo.</p>')}`}
function cards(){return `<h2>💳 Cartões de crédito</h2>${card(`<h3>Adicionar cartão</h3><form id="cardForm"><div class="form">${field('Nome',input('cName','Ex.: Cartão Nubank','text','required'))}${field('Limite total',input('cLimit','0,00','number','min="0" step="0.01" required'))}${field('Dia do fechamento',input('cClose','1 a 28','number','min="1" max="28" required'))}${field('Dia do vencimento',input('cDue','1 a 28','number','min="1" max="28" required'))}</div><div class="actions"><button class="primary">Adicionar cartão</button></div></form>`)}${data.cards.map(c=>card(`<div class="row"><div><strong>${safe(c.name)}</strong><small>Fecha dia ${c.close} • Vence dia ${c.due}</small></div>${del('cards',c.id)}</div><div class="grid"><div><div class="muted">Limite cadastrado</div><strong>${money(c.limit)}</strong></div><div><div class="muted">Compras registradas*</div><strong>${money(cardSpent(c.id))}</strong></div></div><p class="muted">*Total histórico de compras. Esta versão não calcula limite liberado por fatura nem parcelas futuras.</p>`)).join('')||card('<p class="muted">Nenhum cartão cadastrado.</p>')}`}
function goals(){return `<h2>🎯 Metas financeiras</h2>${card(`<h3>Nova meta</h3><form id="goalForm"><div class="form">${field('Objetivo',input('gName','Ex.: Reserva de emergência','text','required'))}${field('Valor desejado',input('gTarget','0,00','number','min="0.01" step="0.01" required'))}${field('Já guardado',input('gSaved','0,00','number','min="0" step="0.01" value="0" required'))}${field('Reserva mensal planejada',input('gMonthly','0,00','number','min="0" step="0.01" value="0" required'))}${field('Prazo (opcional)',input('gDeadline','','date'))}</div><div class="actions"><button class="primary">Criar meta</button></div></form>`)}${data.goals.map(g=>{let p=Math.min(100,Math.round(100*g.saved/g.target));return card(`<div class="row"><div><strong>${safe(g.name)}</strong><small>${money(g.saved)} de ${money(g.target)} • ${p}% ${g.deadline?'• Até '+datefmt(g.deadline):''}</small></div>${del('goals',g.id)}</div><div class="progress"><div style="width:${p}%"></div></div><div class="muted">Faltam ${money(Math.max(0,g.target-g.saved))} • Reserva mensal planejada: ${money(g.monthly)}</div><form class="addGoal actions" data-goal="${safe(g.id)}"><input type="number" step="0.01" min="0.01" required placeholder="Valor guardado" style="max-width:170px"><button class="primary">+ Registrar economia</button></form><p class="muted">A meta é um acompanhamento separado: registrar economia aqui não altera o saldo das contas.</p>`)}).join('')||card('<p class="muted">Crie sua primeira meta.</p>')}`}
function recurring(){return `<h2>🔁 Despesas fixas</h2><div class="note">As despesas fixas são lançadas automaticamente ao abrir o aplicativo em cada mês, com vencimento até o dia 28. Evite cadastrar a mesma despesa manualmente.</div>${card(`<h3>Nova despesa fixa</h3><form id="recForm"><div class="form">${field('Descrição',input('rName','Ex.: Internet','text','required'))}${field('Valor mensal',input('rAmount','0,00','number','min="0.01" step="0.01" required'))}${field('Dia de vencimento',input('rDay','1 a 28','number','min="1" max="28" required'))}${field('Conta (opcional)',`<select id="rAccount">${options(data.accounts,'Sem conta')}</select>`)}</div><div class="actions"><button class="primary">Cadastrar despesa fixa</button></div></form>`)}${card(data.recurring.length?data.recurring.map(r=>row(safe(r.name),`Todo dia ${r.day}`,money(r.amount),del('recurring',r.id))).join(''):'<p class="muted">Nenhuma despesa fixa cadastrada.</p>')}`}
function reports(){let categories={};monthTx().filter(t=>['expense','card'].includes(t.type)).forEach(t=>categories[t.category||'Outros']=(categories[t.category||'Outros']||0)+t.amount);let max=Math.max(1,...Object.values(categories));return `<h2>📊 Relatórios</h2>${card(`<h3>Gastos por categoria • ${monthTitle(data.month)}</h3>${Object.keys(categories).length?Object.entries(categories).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="bar"><span>${safe(k)}</span><div><i style="width:${v/max*100}%"></i></div><strong style="font-size:12px">${money(v)}</strong></div>`).join(''):'<p class="muted">Sem despesas neste mês.</p>'}`)}${card(`<h3>Resumo mensal</h3>${row('Receitas','',money(inc()))}${row('Despesas','',money(exp()))}${row('Diferença','',money(inc()-exp()))}`)}`}
function settings(){return `<h2>⚙️ Configurações e backup</h2>${card(`<h3>Salário</h3><form id="settingsForm"><div class="form">${field('Salário mensal (R$)',input('salary','','number',`min="0" step="0.01" value="${data.salary}" required`))}${field('Dia do recebimento',input('payday','','number',`min="1" max="28" value="${data.payday}" required`))}</div><div class="actions"><button class="primary">Salvar configurações</button></div></form><p class="muted">O salário cadastrado é usado no planejamento, mas não é lançado automaticamente como receita. Registre o recebimento em Movimentações para atualizar seu saldo.</p>`)}${card(`<h3>💾 Seus dados</h3><p class="muted">As informações ficam somente neste navegador/aparelho. Se limpar os dados do navegador ou trocar de celular, poderá perdê-las.</p><div class="actions">${btn('⬇ Exportar backup','export','primary')}<label style="padding:10px;border:1px solid #d9e1ed;border-radius:10px;cursor:pointer">⬆ Importar backup<input type="file" id="import" accept="application/json,.json" style="display:none"></label></div><p class="muted">Importar substitui os dados atuais. Não coloque o backup no repositório público do GitHub.</p>`)}${card(`<h3>Privacidade</h3><p class="muted">Não há login, sincronização com bancos nem armazenamento em servidor. Não use o aplicativo como único registro financeiro.</p>`)}`}
const tabs=[['inicio','🏠 Início'],['movimentos','💸 Movimentações'],['contas','🏦 Contas'],['cartoes','💳 Cartões'],['metas','🎯 Metas'],['fixas','🔁 Fixas'],['relatorios','📊 Relatórios'],['config','⚙️ Ajustes']];const pages={inicio:home,movimentos:movements,contas:accounts,cartoes:cards,metas:goals,fixas:recurring,relatorios:reports,config:settings};function render(){applyRecurring();$('#tabs').innerHTML=tabs.map(([id,name])=>`<button class="tab ${tab===id?'active':''}" data-tab="${id}">${name}</button>`).join('');$('#view').innerHTML=pages[tab]();}
function applyRecurring(){const current=ym(today());for(const r of data.recurring){const start=r.start||current;let [y,m]=start.split('-').map(Number),[ey,em]=current.split('-').map(Number);let count=0;while(y<ey||(y===ey&&m<=em)){const mm=`${y}-${String(m).padStart(2,'0')}`,id=`rec-${r.id}-${mm}`;if(!data.transactions.some(t=>t.id===id)){data.transactions.push({id,type:'expense',desc:r.name,amount:r.amount,date:`${mm}-${String(r.day).padStart(2,'0')}`,category:'Fixa',account:r.account||''})}m++;if(m===13){m=1;y++}if(++count>120)break}}save()}
const get=id=>$('#'+id)?.value;const requireAmount=id=>{let v=Number(get(id));if(!Number.isFinite(v)||v<=0)throw Error('Informe um valor maior que zero.');return num(v)};document.addEventListener('click',e=>{const t=e.target.closest('[data-tab],[data-del],[data-action]');if(!t)return;if(t.dataset.tab){tab=t.dataset.tab;render();return}if(t.dataset.del){const kind=t.dataset.del,id=t.dataset.id;if(!confirm('Excluir este registro?'))return;if(kind==='accounts'&&data.transactions.some(x=>x.account===id))return alert('Esta conta possui movimentações. Exclua ou transfira os lançamentos antes.');data[kind]=data[kind].filter(x=>x.id!==id);save();render();return}if(t.dataset.action==='export'){const blob=new Blob([JSON.stringify({version:2,exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup-financeiro-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}});
document.addEventListener('change',async e=>{if(e.target.id==='month'){data.month=e.target.value;save();render()}if(e.target.id==='import'){try{const f=e.target.files[0];if(!f)return;const raw=JSON.parse(await f.text()),d=raw.data;if(!d||!Array.isArray(d.transactions)||!Array.isArray(d.accounts)||!Array.isArray(d.cards)||!Array.isArray(d.goals)||!Array.isArray(d.recurring))throw Error('Arquivo incompatível');if(!confirm('Substituir todos os dados atuais pelo backup?'))return;data={...initial(),...d};save();render();alert('Backup restaurado!')}catch(err){alert('Não foi possível importar: '+err.message)}}});
document.addEventListener('submit',e=>{const f=e.target;if(!['txForm','accountForm','cardForm','goalForm','recForm','settingsForm'].includes(f.id)&&!f.classList.contains('addGoal'))return;e.preventDefault();try{if(f.id==='txForm'){const type=get('txType'),amount=requireAmount('txAmount'),account=get('txAccount'),dest=get('txDest'),cardId=get('txCard'),date=get('txDate'),desc=get('txDesc').trim(),category=get('txCategory');if(!desc)throw Error('Informe a descrição.');if(type==='transfer'&&(!account||!dest||account===dest))throw Error('Selecione duas contas diferentes.');if(type==='card'&&!cardId)throw Error('Cadastre e selecione um cartão.');if(type==='card_payment'&&(!account||!cardId))throw Error('Selecione a conta e o cartão.');if(type==='transfer'){let pair=uid();data.transactions.push({id:uid(),pair,type:'transfer_out',desc,amount,date,account,category:'Transferência'},{id:uid(),pair,type:'transfer_in',desc,amount,date,account:dest,category:'Transferência'})}else data.transactions.push({id:uid(),type,desc,amount,date,account,card:cardId,category})}else if(f.id==='accountForm')data.accounts.push({id:uid(),name:get('aName').trim(),opening:num(get('aOpening'))});else if(f.id==='cardForm')data.cards.push({id:uid(),name:get('cName').trim(),limit:requireAmount('cLimit'),close:Number(get('cClose')),due:Number(get('cDue'))});else if(f.id==='goalForm')data.goals.push({id:uid(),name:get('gName').trim(),target:requireAmount('gTarget'),saved:num(get('gSaved')),monthly:num(get('gMonthly')),deadline:get('gDeadline')});else if(f.id==='recForm')data.recurring.push({id:uid(),name:get('rName').trim(),amount:requireAmount('rAmount'),day:Number(get('rDay')),account:get('rAccount'),start:ym(today())});else if(f.id==='settingsForm'){data.salary=num(get('salary'));data.payday:Number(get('payday'))}else if(f.classList.contains('addGoal')){let g=data.goals.find(x=>x.id===f.dataset.goal);if(g)g.saved=num(g.saved+Number(f.querySelector('input').value))}save();render()}catch(err){alert(err.message)}});render();})();
</script></body></html>
