</style></head><body><header><div class="top-actions"><h1>💙 Meu Controle Financeiro</h1><button class="theme-toggle" id="themeToggle" type="button" aria-label="Alternar modo escuro">🌙</button></div><div class="muted">Pessoal • Versão 2.4 • Dados neste navegador</div></header><main class="wrap"><nav class="tabs" id="tabs"></nav><section id="view"></section><nav id="bottomNav" class="bottom-nav" aria-label="Navegação principal"></nav><footer>Gratuito • Dados locais • Exporte backups regularmente</footer></main><script>(()=>{'use strict';
const KEY='meu_financeiro_v2', $=s=>document.querySelector(s), money=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), num=v=>Math.round((Number(v)||0)*100)/100, id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8), iso=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`, month=s=>String(s||iso()).slice(0,7), fmt=s=>s?String(s).split('-').reverse().join('/'):'';
const defaults={expense:['🏠 Moradia','🛒 Alimentação','🚗 Transporte','🐶 Pets','💪 Academia e esportes','📱 Internet e telefone','💳 Cartão de crédito','🎮 Lazer','🛍️ Compras','📚 Educação','🩺 Saúde','📦 Outros'],income:['💵 Salário','💰 Renda extra','🛒 Vendas','🎁 Presentes','📈 Investimentos','💸 Outros']};
const initial=()=>({salary:0,payday:10,accounts:[],cards:[],transactions:[],recurring:[],goals:[],investments:[],oneTimeBills:[],month:month(),categories:[],confirmations:{}});
let data;try{data=JSON.parse(localStorage.getItem(KEY))||initial()}catch{data=initial()}for(const [k,v] of Object.entries(initial()))if(data[k]===undefined)data[k]=v;
if(!Array.isArray(data.oneTimeBills))data.oneTimeBills=[];if(!Array.isArray(data.categories))data.categories=[];if(!Array.isArray(data.investments))data.investments=[];
if(!data.categories.length){for(const [type,names] of Object.entries(defaults))for(const name of names)data.categories.push({id:id(),name,type})}
// Older versions posted recurring entries automatically. Convert those entries into pending confirmations, without deducting balances.
for(const t of data.transactions){if(String(t.id).startsWith('rec-')&&!t.manualConfirmed){const parts=String(t.id).split('-');const ym=t.date?.slice(0,7);const rec=data.recurring.find(r=>String(t.id)===`rec-${r.id}-${ym}`);if(rec){data.confirmations[`${rec.id}:${ym}`]={status:'pending'};t._legacyRecurring=true}}}
data.transactions=data.transactions.filter(t=>!t._legacyRecurring);
for(const r of data.recurring){if(!r.type)r.type='expense';if(!r.start)r.start=month();}
let tab='inicio';try{if(localStorage.getItem('finance_theme_24')==='dark')document.body.classList.add('dark')}catch(e){}function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('Armazenamento cheio. Exporte um backup.')}}save();
const v=k=>$('#'+k)?.value||'', amount=k=>{const n=Number(v(k));if(!Number.isFinite(n)||n<=0)throw Error('Informe um valor maior que zero.');return num(n)}, select=(items,empty='Selecione')=>`<option value="">${empty}</option>`+items.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join(''), fld=(label,html)=>`<div class="field"><label>${label}</label>${html}</div>`, inp=(key,type='text',placeholder='',attrs='')=>`<input id="${key}" type="${type}" placeholder="${placeholder}" ${attrs}>`, box=html=>`<article class="card">${html}</article>`, remove=(kind,key)=>`<button class="danger" data-del="${kind}" data-id="${esc(key)}">Excluir</button>`, line=(title,sub,side)=>`<div class="row"><div><strong>${title}</strong><small>${sub}</small></div><div>${side}</div></div>`, getCat=(type)=>data.categories.filter(c=>c.type===type), cats=(type)=>getCat(type).map(c=>`<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('');
const balance=key=>{const a=data.accounts.find(a=>a.id===key);if(!a)return 0;return num(Number(a.opening||0)+data.transactions.reduce((sum,t)=>sum+(t.account===key?(t.type==='income'?t.amount:['expense','transfer_out','card_payment'].includes(t.type)?-t.amount:['transfer_in','investment_in'].includes(t.type)?t.amount:t.type==='investment_out'?-t.amount:0):0),0))};
const monthly=()=>data.transactions.filter(t=>month(t.date)===data.month), total=(type)=>monthly().filter(t=>type==='expense'?['expense','card'].includes(t.type):t.type==='income').reduce((s,t)=>s+Number(t.amount||0),0);
function nextPay(){const now=new Date(),day=Math.max(1,Math.min(28,Number(data.payday)||10));let next=new Date(now.getFullYear(),now.getMonth(),day);if(next<=new Date(now.getFullYear(),now.getMonth(),now.getDate()))next=new Date(now.getFullYear(),now.getMonth()+1,day);const days=Math.max(1,Math.round((next-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/86400000));return {date:iso(next),days}}
const state=(r,ym)=>data.confirmations[`${r.id}:${ym}`]?.status==='paid'?'paid':`${ym}-${String(r.day).padStart(2,'0')}`<iso()?'late':'pending';
function dueItems(ym){return data.recurring.filter(r=>(r.start||ym)<=ym).map(r=>({r,ym,key:`${r.id}:${ym}`,date:`${ym}-${String(r.day).padStart(2,'0')}`,status:state(r,ym)}))}
function txForm(){return `<form id="txForm"><div class="form">${fld('Tipo',`<select id="txType"><option value="expense">Despesa</option><option value="income">Receita</option><option value="card">Compra no cartão</option><option value="transfer">Transferência</option><option value="card_payment">Pagamento de fatura</option></select>`)}${fld('Descrição',inp('txDesc','text','Ex.: Mercado','required'))}${fld('Valor (R$)',inp('txAmount','number','0,00','step="0.01" min="0.01" required'))}${fld('Data',inp('txDate','date','','required value="'+iso()+'"'))}${fld('Categoria',`<select id="txCategory">${cats('expense')}</select>`)}${fld('Conta',`<select id="txAccount">${select(data.accounts,'Sem conta')}</select>`)}${fld('Destino (transferência)',`<select id="txDest">${select(data.accounts)}</select>`)}${fld('Cartão',`<select id="txCard">${select(data.cards)}</select>`)}</div><div class="actions"><button class="primary">+ Registrar</button></div></form>`}
function txList(items){return items.length?items.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(t=>line(esc(t.desc),`${fmt(t.date)} • ${esc(t.category||t.type)}`,`<strong class="${t.type==='income'?'green':'red'}">${t.type==='income'?'+':'−'} ${money(t.amount)}</strong> ${remove('transactions',t.id)}`)).join(''):'<p class="muted">Nenhum lançamento.</p>'}
function home(){const pay=nextPay(),totalBank=data.accounts.reduce((s,a)=>s+balance(a.id),0),pending=dueItems(month()).filter(x=>x.status!=='paid'),fixedOut=pending.filter(x=>x.r.type==='expense').reduce((s,x)=>s+x.r.amount,0),reserve=data.goals.reduce((s,g)=>s+Number(g.monthly||0),0),available=Math.max(0,totalBank-fixedOut-reserve);return `<div class="section-title"><h2>🏠 Resumo financeiro</h2><input id="month" type="month" value="${data.month}" style="width:160px"></div><div class="grid">${box(`<div class="muted">Saldo bancário</div><div class="value blue">${money(totalBank)}</div>`)}${box(`<div class="muted">Receitas do mês</div><div class="value green">${money(total('income'))}</div>`)}${box(`<div class="muted">Despesas do mês</div><div class="value red">${money(total('expense'))}</div>`)}${box(`<div class="muted">Resultado do mês</div><div class="value">${money(total('income')-total('expense'))}</div>`)}</div>${box(`<h3>📅 Próximo salário: ${fmt(pay.date)}</h3><div class="muted">Recebimento dia ${data.payday} • ${pay.days} dias até o próximo pagamento</div><div class="value blue">${money(available/pay.days)} por dia</div><p class="hint">Estimativa = saldos cadastrados − despesas fixas pendentes deste mês − reservas planejadas, dividido pelos dias restantes. Não inclui dívidas futuras de cartão; confira antes de gastar.</p>`)}${box(`<h3>🔔 Contas avulsas próximas do vencimento</h3>${personalBillRows(data.oneTimeBills.filter(b=>!b.paid&&b.due<=iso(new Date(Date.now()+3*86400000))))}<div class="actions"><button data-tab="avulsas">Ver todas as contas</button></div>`)}${box(`<h3>📆 Próximos compromissos</h3>${dueRows(dueItems(month()).filter(x=>x.status!=='paid').slice(0,6))}`)}${box(`<h3>⚡ Nova movimentação</h3>${txForm()}`)}${box(`<h3>Últimos lançamentos</h3>${txList(data.transactions.slice(-5))}`)}`}
function dueRows(items){return items.length?items.sort((a,b)=>a.date.localeCompare(b.date)).map(({r,ym,status})=>line(esc(r.name),`${fmt(`${ym}-${String(r.day).padStart(2,'0')}`)} • ${r.type==='income'?'Receita':'Despesa'} • <span class="status ${status}">${status==='paid'?'Confirmado':status==='late'?'Atrasado':'Pendente'}</span>`,`${money(r.amount)} ${status!=='paid'?`<button class="primary" data-confirm="${esc(r.id)}" data-ym="${ym}">Confirmar</button>`:''}`)).join(''):'<p class="muted">Nenhum compromisso pendente.</p>'}
function movements(){return `<h2>💸 Movimentações</h2>${box(txForm())}${box(`<h3>Histórico mensal</h3><input id="month" type="month" value="${data.month}" style="max-width:180px">${txList(monthly())}`)}`}
function categories(){return `<h2>🗂️ Categorias editáveis</h2>${box(`<form id="catForm"><div class="form">${fld('Tipo',`<select id="catType"><option value="expense">Despesa</option><option value="income">Receita</option></select>`)}${fld('Nome (pode incluir emoji)',inp('catName','text','Ex.: 🐶 Veterinário','required'))}</div><div class="actions"><button class="primary">Adicionar categoria</button></div></form>`)}${['expense','income'].map(type=>box(`<h3>${type==='expense'?'🔴 Despesas':'🟢 Receitas'}</h3>${getCat(type).map(c=>line(esc(c.name),'Categoria personalizada',`<button data-edit="category" data-id="${c.id}">Editar</button> ${remove('categories',c.id)}`)).join('')||'<p>Sem categorias.</p>'}`)).join('')}<p class="hint">Editar uma categoria também atualiza os lançamentos antigos que usam esse nome e tipo.</p>`}
function accounts(){return `<h2>🏦 Contas</h2>${box(`<form id="accountForm"><div class="form">${fld('Nome da conta',inp('aName','text','Ex.: Nubank','required'))}${fld('Saldo inicial',inp('aOpening','number','0,00','step="0.01" required'))}</div><div class="actions"><button class="primary">Adicionar conta</button></div></form>`)}${data.accounts.map(a=>box(line(esc(a.name),'Saldo atualizado',`<strong>${money(balance(a.id))}</strong> <button data-edit="account" data-id="${a.id}">Editar</button> ${remove('accounts',a.id)}`))).join('')}`}
function cards(){return `<h2>💳 Cartões</h2>${box(`<form id="cardForm"><div class="form">${fld('Nome',inp('cName','text','Ex.: Nubank','required'))}${fld('Limite total',inp('cLimit','number','0,00','min="0" step="0.01" required'))}${fld('Dia do fechamento',inp('cClose','number','1 a 28','min="1" max="28" required'))}${fld('Dia do vencimento',inp('cDue','number','1 a 28','min="1" max="28" required'))}</div><div class="actions"><button class="primary">Adicionar cartão</button></div></form>`)}${data.cards.map(c=>box(line(esc(c.name),`Fecha dia ${c.close} • Vence dia ${c.due} • Limite ${money(c.limit)}`,`<button data-edit="card" data-id="${c.id}">Editar</button> ${remove('cards',c.id)}`))).join('')}<div class="note">Compras no cartão são despesas na data da compra. Pagamento de fatura reduz a conta bancária sem gerar nova despesa. Parcelamento e cálculo de faturas ainda não são automáticos.</div>`}

document.addEventListener('click',e=>{if(e.target.closest('#themeToggle')){document.body.classList.toggle('dark');try{localStorage.setItem('finance_theme_24',document.body.classList.contains('dark')?'dark':'light')}catch(err){}render();return}const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render();return}if(b.dataset.inv){const i=data.investments.find(x=>x.id===b.dataset.id);if(!i)return;const op=b.dataset.inv;const raw=prompt(op==='atualizar'?'Novo valor atual (R$):':op==='aporte'?'Valor do aporte (R$):':'Valor do resgate (R$):',op==='atualizar'?i.current:'');if(raw===null)return;const n=Number(raw.replace(',','.'));if(!Number.isFinite(n)||n<0||(op!=='atualizar'&&n<=0))return alert('Valor inválido.');if(op==='atualizar')i.current=num(n);else{if(op==='resgate'&&n>i.current)return alert('Resgate maior que valor atual.');if(op==='aporte'&&i.account&&balance(i.account)<n&&!confirm('O saldo da conta ficará negativo. Continuar?'))return;i.current=num(Number(i.current)+(op==='aporte'?n:-n));const reduction=op==='resgate'&&Number(i.current)+n>0?Number(i.principal)*n/(Number(i.current)+n):n;i.principal=num(Math.max(0,Number(i.principal)+(op==='aporte'?n:-reduction)));if(i.account){data.transactions.push({id:id(),type:op==='aporte'?'investment_out':'investment_in',desc:`${op==='aporte'?'Aporte':'Resgate'}: ${i.name}`,amount:n,date:iso(),account:i.account,category:'Investimento'});}}save();render();return}if(b.dataset.confirm){confirmDue(b.dataset.confirm,b.dataset.ym);return}if(b.dataset.export){const blob=new Blob([JSON.stringify({version:23,exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`backup-financeiro-${iso()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);return}if(b.dataset.edit){const kind=b.dataset.edit,entry=(kind==='category'?data.categories:kind==='account'?data.accounts:kind==='card'?data.cards:data.recurring).find(x=>x.id===b.dataset.id);if(!entry)return;const name=prompt('Novo nome:',entry.name);if(name===null)return;if(!name.trim())return alert('Nome obrigatório.');if(kind==='category'){const old=entry.name;entry.name=name.trim();data.transactions.filter(t=>t.category===old&&(entry.type==='income'?t.type==='income':['expense','card'].includes(t.type))).forEach(t=>t.category=entry.name)}else{entry.name=name.trim();if(kind==='account'){const val=prompt('Saldo inicial:',entry.opening);if(val===null)return;if(!Number.isFinite(Number(val)))return alert('Valor inválido');entry.opening=num(val)}if(kind==='card'){for(const [key,label] of [['limit','Limite'],['close','Dia do fechamento'],['due','Dia do vencimento']]){const val=prompt(label,entry[key]);if(val===null)return;if(!Number.isFinite(Number(val)))return alert('Valor inválido');entry[key]=Number(val)}}if(kind==='recurring'){const value=prompt('Valor mensal:',entry.amount),day=prompt('Dia do mês (1 a 28):',entry.day);if(value===null||day===null)return;if(!Number.isFinite(Number(value))||Number(value)<=0||Number(day)<1||Number(day)>28)return alert('Valores inválidos');entry.amount=num(value);entry.day=Number(day)}}save();render();return}if(b.dataset.del){const kind=b.dataset.del,key=b.dataset.id;if(!confirm('Deseja excluir?'))return;if(kind==='accounts'&&data.transactions.some(t=>t.account===key))return alert('A conta possui movimentações. Não é possível excluir.');if(kind==='accounts'&&data.investments.some(i=>i.account===key))return alert('Conta vinculada a investimentos.');if(kind==='cards'&&data.transactions.some(t=>t.card===key))return alert('Cartão com lançamentos não pode ser excluído.');if(kind==='transactions'){const tx=data.transactions.find(t=>t.id===key);if(tx?.recurringKey)delete data.confirmations[tx.recurringKey];if(tx?.oneTimeBillId){const bill=data.oneTimeBills.find(b=>b.id===tx.oneTimeBillId);if(bill){bill.paid=false;bill.paidDate='';bill.txid=''}}if(tx?.pair)data.transactions=data.transactions.filter(t=>t.pair!==tx.pair);else data.transactions=data.transactions.filter(t=>t.id!==key)}else data[kind]=data[kind].filter(x=>x.id!==key);save();render()}});
document.addEventListener('change',async e=>{if(e.target.id==='month'){data.month=e.target.value;save();render()}if(e.target.id==='txType')syncCategory();if(e.target.id==='import'){try{const f=e.target.files?.[0];if(!f)return;const raw=JSON.parse(await f.text()),d=raw.data;if(!d||!['transactions','accounts','cards','goals','recurring'].every(k=>Array.isArray(d[k])))throw Error('Backup incompatível');if(!confirm('Substituir TODOS os dados atuais pelo backup?'))return;data={...initial(),...d};if(!Array.isArray(data.oneTimeBills))data.oneTimeBills=[];if(!Array.isArray(data.categories)||!data.categories.length)data.categories=Object.entries(defaults).flatMap(([type,names])=>names.map(name=>({id:id(),type,name})));if(!data.confirmations)data.confirmations={};save();render();alert('Backup restaurado')}catch(err){alert('Falha ao importar: '+err.message)}}});
document.addEventListener('submit',e=>{const f=e.target;if(!['invForm','txForm','catForm','accountForm','cardForm','recForm','goalForm','settingsForm'].includes(f.id)&&!f.classList.contains('goalAdd'))return;e.preventDefault();try{if(f.id==='invForm'){const name=v('iName').trim(),principal=Number(v('iPrincipal')),current=Number(v('iCurrent'));if(!name||![principal,current].every(x=>Number.isFinite(x)&&x>=0))throw Error('Dados inválidos');data.investments.push({id:id(),name,type:v('iType'),principal:num(principal),current:num(current),account:v('iAccount'),goal:v('iGoal')})}else if(f.id==='txForm'){const type=v('txType'),a=amount('txAmount'),desc=v('txDesc').trim(),date=v('txDate'),account=v('txAccount'),dest=v('txDest'),card=v('txCard');if(!desc)throw Error('Informe descrição.');if(type==='transfer'){if(!account||!dest||account===dest)throw Error('Escolha contas diferentes.');const pair=id();data.transactions.push({id:id(),pair,type:'transfer_out',desc,amount:a,date,account,category:'Transferência'},{id:id(),pair,type:'transfer_in',desc,amount:a,date,account:dest,category:'Transferência'})}else{if(type==='card'&&!card)throw Error('Selecione um cartão.');if(type==='card_payment'&&(!card||!account))throw Error('Selecione cartão e conta.');data.transactions.push({id:id(),type,desc,amount:a,date,account,card,category:v('txCategory')})}}else if(f.id==='catForm'){const name=v('catName').trim(),type=v('catType');if(!name)throw Error('Nome obrigatório');if(data.categories.some(c=>c.type===type&&c.name.toLowerCase()===name.toLowerCase()))throw Error('Categoria já existe');data.categories.push({id:id(),name,type})}else if(f.id==='accountForm'){data.accounts.push({id:id(),name:v('aName').trim(),opening:Number(v('aOpening'))||0})}else if(f.id==='cardForm'){data.cards.push({id:id(),name:v('cName').trim(),limit:amount('cLimit'),close:Number(v('cClose')),due:Number(v('cDue'))})}else if(f.id==='recForm'){data.recurring.push({id:id(),name:v('rName').trim(),type:v('rType'),amount:amount('rAmount'),day:Number(v('rDay')),account:v('rAccount'),start:month()})}else if(f.id==='goalForm'){data.goals.push({id:id(),name:v('gName').trim(),target:amount('gTarget'),saved:num(v('gSaved')),monthly:num(v('gMonthly')),deadline:v('gDeadline')})}else if(f.id==='settingsForm'){data.salary=num(v('salary'));data.payday=Number(v('payday'))}else if(f.classList.contains('goalAdd')){const g=data.goals.find(g=>g.id===f.dataset.id),n=Number(f.querySelector('input').value);if(!g||!Number.isFinite(n)||n<=0)throw Error('Valor inválido');g.saved=num(g.saved+n)}save();render()}catch(err){alert(err.message)}});

if(!data.business||typeof data.business!=='object')data.business={};
const biz=data.business;
for(const [k,val] of Object.entries({sales:[],bills:[],entries:[],opening:0,noticeDays:3}))if(biz[k]===undefined)biz[k]=val;
let context='personal',bizTab='painel';
const bsum=arr=>num(arr.reduce((s,x)=>s+Number(x||0),0));
const paid=item=>bsum((item.payments||[]).map(p=>p.amount));
const outstanding=item=>num(Math.max(0,Number(item.amount||0)-paid(item)));
const bdate=d=>d||iso();
const bmonth=d=>String(d||'').slice(0,7);
const bstatus=item=>{if(outstanding(item)<.005)return 'paid';if(!item.due)return 'pending';return item.due<iso()?'late':item.due===iso()?'today':'pending'};
const bstatusText=item=>({paid:'Pago',late:'Atrasado',today:'Vence hoje',pending:'Pendente'})[bstatus(item)];
const bpayments=()=>[...biz.sales.flatMap(x=>(x.payments||[]).map(p=>({...p,kind:'income',name:'Venda: '+x.name,ref:x.id}))),...biz.bills.flatMap(x=>(x.payments||[]).map(p=>({...p,kind:'expense',name:x.name,ref:x.id}))),...biz.entries.map(x=>({...x,kind:x.type,name:x.name}))];
const btotal=(type,ym)=>bsum(bpayments().filter(x=>x.kind===type&&(!ym||bmonth(x.date)===ym)).map(x=>x.amount));
const bbalance=()=>num(Number(biz.opening||0)+btotal('income')-btotal('expense'));
const bfield=(label,html)=>fld(label,html);
const binput=(name,type,placeholder,extra='')=>`<input name="${name}" type="${type}" placeholder="${placeholder||''}" ${extra}>`;
const bmoney=(n)=>money(num(n));
function balerts(){return [...biz.sales.map(x=>({...x,kind:'sale'})),...biz.bills.map(x=>({...x,kind:'bill'}))].filter(x=>outstanding(x)>.005&&x.due).sort((a,b)=>a.due.localeCompare(b.due));}
function bnotice(){const items=balerts().filter(x=>{const diff=Math.ceil((new Date(x.due+'T12:00:00')-new Date(iso()+'T12:00:00'))/86400000);return diff<=Number(biz.noticeDays||3)});return items.length?box(`<h3>🔔 Avisos de vencimento (${items.length})</h3>${items.map(x=>`<div class="business-notice"><strong>${x.due<iso()?'🔴 Atrasado':x.due===iso()?'🟠 Vence hoje':'🟡 Próximo vencimento'}: ${esc(x.kind==='sale'?'Cobrar '+x.name:'Pagar '+x.name)}</strong><br>${bmoney(outstanding(x))} • ${fmt(x.due)}</div>`).join('')}`):''}
function bgraph(){const ym=month();const keys=[];for(let i=5;i>=0;i--){const d=new Date(Number(ym.slice(0,4)),Number(ym.slice(5,7))-1-i,1);keys.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`)}const rows=keys.map(k=>[k,btotal('income',k),btotal('expense',k)]),mx=Math.max(1,...rows.flatMap(x=>x.slice(1)));return `<div class="business-chart">${rows.map(([k,inc,out])=>`<div class="business-chart-item"><div class="business-chart-bars"><i title="Entradas ${bmoney(inc)}" style="height:${Math.max(2,inc/mx*100)}%"></i><i class="out" title="Saídas ${bmoney(out)}" style="height:${Math.max(2,out/mx*100)}%"></i></div><span>${k.slice(5)}/${k.slice(2,4)}</span></div>`).join('')}</div><p class="hint">🟢 Entradas &nbsp; 🔴 Saídas • últimos seis meses</p>`}
function bmenu(){return `<div class="business-menu">${[['painel','🏠 Painel'],['vendas','💰 Entradas'],['saidas','💸 Saídas'],['pendencias','📅 Pendências'],['relatorios','📊 Relatórios'],['ajustes','⚙️ Ajustes']].map(([k,t])=>`<button type="button" data-btab="${k}" class="${bizTab===k?'selected':''}">${t}</button>`).join('')}</div>`}
function bpanel(){const ym=data.month;const recv=bsum(biz.sales.map(outstanding)),pay=bsum(biz.bills.map(outstanding)),inc=btotal('income',ym),out=btotal('expense',ym);return `<div class="business-banner"><h2>🏪 Caixa JP Sports</h2><div class="muted">Controle financeiro separado das finanças pessoais</div><div class="business-amount">${bmoney(bbalance())}</div><small>Saldo disponível registrado</small></div><div class="grid">${box(`<div class="muted">Entradas do mês</div><div class="value green">${bmoney(inc)}</div>`)}${box(`<div class="muted">Saídas do mês</div><div class="value red">${bmoney(out)}</div>`)}${box(`<div class="muted">A receber</div><div class="value blue">${bmoney(recv)}</div>`)}${box(`<div class="muted">A pagar</div><div class="value red">${bmoney(pay)}</div>`)}${box(`<div class="muted">Resultado do mês</div><div class="value">${bmoney(inc-out)}</div>`)}${box(`<div class="muted">Impostos pagos no mês</div><div class="value">${bmoney(bpayments().filter(x=>x.kind==='expense'&&bmonth(x.date)===ym&&x.category==='Impostos').map(x=>x.amount).reduce((a,b)=>a+b,0))}</div>`)}</div>${bnotice()}${box(`<h3>📊 Entradas e saídas</h3>${bgraph()}`)}${box(`<h3>⚡ Acesso rápido</h3><div class="actions"><button class="primary" data-btab="vendas">+ Registrar venda</button><button data-btab="saidas">+ Registrar saída</button><button data-btab="pendencias">Ver cobranças</button></div>`)}<p class="hint">O resultado é o fluxo de caixa (recebido − pago), não o lucro contábil. O lucro por produto permanece na sua planilha.</p>`}
function bsaleForm(){return box(`<h3>💰 Nova venda / entrada de cliente</h3><form id="bsaleForm"><div class="form">${bfield('Nome do cliente',binput('name','text','Nome completo','required'))}${bfield('Contato / WhatsApp',binput('phone','tel','DDD + número'))}${bfield('Valor total da venda (R$)',binput('amount','number','430,00','min="0.01" step="0.01" required'))}${bfield('Recebido agora (R$)',binput('first','number','250,00','min="0" step="0.01" value="0" required'))}${bfield('Data da venda',binput('date','date','','value="'+iso()+'" required'))}${bfield('Previsão do restante',binput('due','date',''))}</div><div class="actions"><button class="primary">Salvar venda</button></div><p class="hint">O valor já recebido entra no caixa. O restante vira conta a receber automaticamente.</p></form>`)}
function bpayButton(item,kind){return `<button class="primary" data-bpay="${kind}" data-id="${esc(item.id)}">${kind==='sale'?'Registrar recebimento':'Registrar pagamento'}</button>`}
function bwhats(x){const digits=String(x.phone||'').replace(/\D/g,'');if(!digits)return '';const phone=digits.length<=11?'55'+digits:digits;const msg=`Olá, ${x.name}! Tudo bem? 😊 Passando para lembrar do pagamento de ${bmoney(outstanding(x))} referente à sua compra na JP Sports, previsto para ${fmt(x.due)}. Qualquer dúvida, estamos à disposição!`;return `<button type="button" data-bwhats="${esc(x.id)}">📲 Cobrar no WhatsApp</button>`}
function bitem(x,kind){const rest=outstanding(x),status=bstatus(x),title=kind==='sale'?x.name:x.name;return `<article class="card ${status==='late'?'business-alert overdue':status==='today'?'business-alert today':''}"><div class="row"><div><strong>${esc(title)}</strong><small>${kind==='sale'?'Cliente • '+esc(x.phone||'Sem contato'):esc(x.category||'Despesa')} • ${fmt(x.date)}</small><small>${x.due?'Vencimento: '+fmt(x.due):'Sem vencimento'} • <span class="status ${status==='late'?'late':status==='paid'?'paid':''}">${bstatusText(x)}</span></small></div><div><strong>${bmoney(x.amount)}</strong><small>Recebido/pago: ${bmoney(paid(x))}</small><small>Pendente: ${bmoney(rest)}</small></div></div><div class="business-row-actions">${rest>.005?bpayButton(x,kind):''}${kind==='sale'&&rest>.005?bwhats(x):''}<button data-bdue="${kind}" data-id="${esc(x.id)}">📅 Alterar prazo</button><button class="danger" data-bdelete="${kind}" data-id="${esc(x.id)}">Excluir</button></div></article>`}
function bsales(){return `<h2>💰 Vendas e entradas</h2>${bsaleForm()}${box(`<h3>➕ Outras entradas</h3><form id="bentryForm"><input type="hidden" name="type" value="income"><div class="form">${bfield('Descrição',binput('name','text','Ex.: Capital adicional','required'))}${bfield('Valor',binput('amount','number','0,00','min="0.01" step="0.01" required'))}${bfield('Data',binput('date','date','','value="'+iso()+'" required'))}</div><div class="actions"><button class="primary">Registrar entrada</button></div></form>`)}<h3>Histórico de vendas</h3>${biz.sales.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>bitem(x,'sale')).join('')||'<p class="muted">Nenhuma venda registrada.</p>'}`}
function bbills(){return `<h2>💸 Saídas e contas a pagar</h2>${box(`<h3>➖ Nova conta / despesa</h3><form id="bbillForm"><div class="form">${bfield('Descrição',binput('name','text','Ex.: Fornecedor, DAS, anúncios','required'))}${bfield('Categoria',`<select name="category">${['Fornecedores','Impostos','Anúncios','Frete','Taxas','Plataformas','Embalagens','Reembolsos e perdas','Outras despesas'].map(c=>`<option>${c}</option>`).join('')}</select>`)}${bfield('Valor total',binput('amount','number','0,00','min="0.01" step="0.01" required'))}${bfield('Valor pago agora',binput('first','number','0,00','min="0" step="0.01" value="0" required'))}${bfield('Data',binput('date','date','','value="'+iso()+'" required'))}${bfield('Vencimento',binput('due','date',''))}</div><div class="actions"><button class="primary">Salvar conta</button></div><p class="hint">Pode cadastrar uma conta ainda não paga. Quando pagar, registre o pagamento no cartão da conta.</p></form>`)}<h3>Contas cadastradas</h3>${biz.bills.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>bitem(x,'bill')).join('')||'<p class="muted">Nenhuma conta registrada.</p>'}`}
function bpend(){const sales=biz.sales.filter(x=>outstanding(x)>.005).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')),bills=biz.bills.filter(x=>outstanding(x)>.005).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));return `<h2>📅 Cobranças e vencimentos</h2>${bnotice()}${box(`<h3>💳 A receber (${sales.length}) • ${bmoney(bsum(sales.map(outstanding)))}</h3>`)}${sales.map(x=>bitem(x,'sale')).join('')||'<p class="muted">Nenhuma cobrança pendente.</p>'}${box(`<h3>🧾 A pagar (${bills.length}) • ${bmoney(bsum(bills.map(outstanding)))}</h3>`)}${bills.map(x=>bitem(x,'bill')).join('')||'<p class="muted">Nenhuma conta pendente.</p>'}`}
function breports(){const payments=bpayments(),ym=data.month,cur=payments.filter(x=>bmonth(x.date)===ym),out=cur.filter(x=>x.kind==='expense'),inc=cur.filter(x=>x.kind==='income'),sumBy={};for(const x of out){const cat=x.category||'Outros';sumBy[cat]=(sumBy[cat]||0)+Number(x.amount)}const ranking=Object.entries(sumBy).sort((a,b)=>b[1]-a[1]);return `<h2>📊 Relatórios JP Sports</h2>${box(`${bfield('Mês de referência',`<input id="month" type="month" value="${data.month}">`)}`)}<div class="grid">${box(`<div class="muted">Entradas recebidas</div><div class="value green">${bmoney(bsum(inc.map(x=>x.amount)))}</div>`)}${box(`<div class="muted">Saídas pagas</div><div class="value red">${bmoney(bsum(out.map(x=>x.amount)))}</div>`)}</div>${box(`<h3>📊 Evolução do caixa</h3>${bgraph()}`)}${box(`<h3>🏆 Onde a loja mais gasta</h3>${columnChart(ranking)}${reportBar(ranking)}${ranking.length?`<p class="hint">Maior categoria: ${esc(ranking[0][0])} — ${bmoney(ranking[0][1])}</p>`:''}`)}${box(`<h3>🧾 Impostos pagos</h3><div class="value">${bmoney(bsum(out.filter(x=>x.category==='Impostos').map(x=>x.amount)))}</div>`)}${box(`<h3>💳 Pendências</h3><p>A receber: <strong>${bmoney(bsum(biz.sales.map(outstanding)))}</strong></p><p>A pagar: <strong>${bmoney(bsum(biz.bills.map(outstanding)))}</strong></p>`)}${box(`<h3>📋 Movimentações do mês</h3>${cur.sort((a,b)=>b.date.localeCompare(a.date)).map(x=>line(esc(x.name),`${fmt(x.date)} • ${esc(x.category||'Venda / entrada')}`,`<strong class="${x.kind==='income'?'green':'red'}">${x.kind==='income'?'+':'−'} ${bmoney(x.amount)}</strong>`)).join('')||'<p class="muted">Sem movimentações no período.</p>'}`)}<p class="hint">Relatório por regime de caixa: considera apenas valores efetivamente recebidos ou pagos. Não calcula lucro por produto.</p>`}
function bsettings(){return `<h2>⚙️ Ajustes da JP Sports</h2>${box(`<form id="bsettingsForm"><div class="form">${bfield('Saldo inicial da loja',binput('opening','number','','step="0.01" value="'+Number(biz.opening||0)+'" required'))}${bfield('Avisar quantos dias antes',binput('noticeDays','number','','min="1" max="30" value="'+Number(biz.noticeDays||3)+'" required'))}</div><div class="actions"><button class="primary">Salvar ajustes</button></div></form>`)}${box(`<h3>💾 Backup</h3><p class="hint">Use Ajustes na área Pessoal → Exportar backup. O arquivo inclui também todos os registros da JP Sports.</p><button data-bexport="1">⬇ Exportar backup completo</button>`)}<div class="note">Os alertas aparecem quando o aplicativo está aberto. Não há notificações garantidas com o navegador fechado. Os dados ficam apenas neste navegador; faça backup antes de trocar de aparelho ou limpar os dados.</div>`}
const bpages={painel:bpanel,vendas:bsales,saidas:bbills,pendencias:bpend,relatorios:breports,ajustes:bsettings};
const personalRender=render;
render=function(){document.querySelector('header .muted').textContent=context==='business'?'JP Sports • Gestão de caixa • Versão 3.0':'Pessoal • Versão 3.0 • Dados neste navegador';let sw=document.getElementById('contextSwitch');if(!sw){sw=document.createElement('div');sw.id='contextSwitch';sw.className='context-switch';document.querySelector('header').appendChild(sw)}sw.innerHTML=`<button data-context="personal" class="${context==='personal'?'selected':''}">👤 Pessoal</button><button data-context="business" class="${context==='business'?'selected':''}">🏪 JP Sports</button>`;if(context==='personal'){personalRender();return}document.getElementById('tabs').innerHTML='';document.getElementById('view').innerHTML=bmenu()+bpages[bizTab]();const nav=[['painel','🏠','Início'],['vendas','💰','Entradas'],['saidas','💸','Saídas'],['pendencias','📅','Pendências'],['relatorios','📊','Relatórios']];document.getElementById('bottomNav').innerHTML=nav.map(([k,ic,l])=>`<button data-btab="${k}" class="${bizTab===k?'active':''}"><span class="nav-icon">${ic}</span>${l}</button>`).join('');document.getElementById('themeToggle').textContent=document.body.classList.contains('dark')?'☀️':'🌙'};
document.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;if(btn.dataset.context){context=btn.dataset.context;render();return}if(btn.dataset.btab){bizTab=btn.dataset.btab;render();window.scrollTo(0,0);return}if(btn.dataset.bexport){document.querySelector('[data-export]')?.click();if(!document.querySelector('[data-export]')){const blob=new Blob([JSON.stringify({version:30,exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`backup-completo-${iso()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}return}if(btn.dataset.bwhats){const x=biz.sales.find(x=>x.id===btn.dataset.bwhats);if(!x)return;let phone=String(x.phone||'').replace(/\D/g,'');if(phone.length<=11)phone='55'+phone;const msg=`Olá, ${x.name}! Tudo bem? 😊 Passando para lembrar do pagamento de ${bmoney(outstanding(x))} referente à sua compra na JP Sports, previsto para ${fmt(x.due)}. Qualquer dúvida, estamos à disposição!`;window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`,'_blank','noopener');return}if(btn.dataset.bdue){const x=(btn.dataset.bdue==='sale'?biz.sales:biz.bills).find(x=>x.id===btn.dataset.id);if(!x)return;const due=prompt('Nova data de vencimento (AAAA-MM-DD):',x.due||iso());if(due===null)return;if(due&&!/^\d{4}-\d{2}-\d{2}$/.test(due))return alert('Data inválida.');x.due=due;save();render();return}if(btn.dataset.bpay){const x=(btn.dataset.bpay==='sale'?biz.sales:biz.bills).find(x=>x.id===btn.dataset.id);if(!x)return;const remaining=outstanding(x),raw=prompt('Valor '+(btn.dataset.bpay==='sale'?'recebido':'pago')+' (R$):',String(remaining));if(raw===null)return;const n=Number(raw.replace(',','.'));if(!Number.isFinite(n)||n<=0||n>remaining+.001)return alert('Informe valor positivo até '+bmoney(remaining));const date=prompt('Data do pagamento (AAAA-MM-DD):',iso());if(date===null)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return alert('Data inválida.');x.payments.push({id:id(),amount:num(n),date,category:x.category||'Vendas'});save();render();return}if(btn.dataset.bdelete){const arr=btn.dataset.bdelete==='sale'?biz.sales:biz.bills;const ix=arr.findIndex(x=>x.id===btn.dataset.id);if(ix<0||!confirm('Excluir este registro e todos os seus pagamentos?'))return;arr.splice(ix,1);save();render();return}});
document.addEventListener('submit',e=>{const f=e.target;if(!['bsaleForm','bbillForm','bentryForm','bsettingsForm'].includes(f.id))return;e.preventDefault();e.stopImmediatePropagation();try{const fd=new FormData(f),val=k=>String(fd.get(k)||'').trim(),positive=k=>{const n=Number(val(k));if(!Number.isFinite(n)||n<=0)throw Error('Informe um valor válido.');return num(n)};if(f.id==='bsettingsForm'){const n=Number(val('opening')),days=Number(val('noticeDays'));if(!Number.isFinite(n)||!Number.isInteger(days)||days<1||days>30)throw Error('Dados inválidos');biz.opening=num(n);biz.noticeDays=days}else if(f.id==='bentryForm'){biz.entries.push({id:id(),name:val('name'),type:'income',category:'Outras entradas',amount:positive('amount'),date:val('date')})}else{const amount=positive('amount'),first=Number(val('first')),name=val('name'),date=val('date'),due=val('due');if(!name||!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isFinite(first)||first<0||first>amount)throw Error('Confira nome, data e valores.');if(first<amount&&!due)throw Error('Informe a data prevista para o valor pendente.');const obj={id:id(),name,amount,date,due,payments:first>0?[{id:id(),amount:num(first),date,category:f.id==='bbillForm'?val('category'):'Vendas'}]:[]};if(f.id==='bsaleForm'){obj.phone=val('phone');biz.sales.push(obj)}else{obj.category=val('category');biz.bills.push(obj)}}save();render();alert('Registro salvo com sucesso!')}catch(err){alert(err.message)}} ,true);

 render();
})();
</script></body></html>
