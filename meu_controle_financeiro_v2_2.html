<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7fb"><title>Meu Controle Financeiro 2.1</title><style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#17233c;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e6eaf2;padding:20px max(18px,calc((100vw - 980px)/2));}h1{font-size:23px;margin:0}h2{font-size:20px;margin:6px 0 18px}h3{font-size:16px;margin:10px 0}.muted{color:#65728a;font-size:13px}.wrap{max-width:980px;margin:auto;padding:18px 14px 95px}.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 0}.tabs button{white-space:nowrap}.tab.active{background:#2459dc;color:white;border-color:#2459dc}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}.card{background:#fff;border:1px solid #e7ebf3;border-radius:17px;padding:17px;margin-bottom:12px;box-shadow:0 2px 10px #142d5b07}.value{font-size:23px;font-weight:750;margin-top:8px}.green{color:#12815b}.red{color:#c43d52}.blue{color:#2459dc}button,input,select{font:inherit}button{background:#fff;border:1px solid #d9e1ed;border-radius:11px;padding:11px 13px;color:#253956;cursor:pointer}button.primary{background:#2459dc;color:#fff;border-color:#2459dc}button.danger{color:#b8324b;border-color:#f0c8d0}input,select{width:100%;padding:12px;border:1px solid #d9e1ed;border-radius:10px;background:#fff;min-width:0}label{font-size:13px;color:#56647b;display:block;margin-bottom:5px}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.field{min-width:0}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #edf0f5}.row:last-child{border:0}.row>div{min-width:0}.row small{color:#64728a;display:block;margin-top:4px}.progress{height:9px;border-radius:9px;background:#e8edf7;overflow:hidden;margin:10px 0}.progress>div{height:100%;background:#2459dc}.hidden{display:none!important}.note{background:#edf4ff;border-radius:12px;padding:12px;font-size:13px;color:#345078;margin-bottom:12px}.pill{display:inline-block;border-radius:12px;background:#eaf0fc;padding:4px 9px;font-size:12px}.bar{display:flex;align-items:center;gap:10px;margin:10px 0}.bar>span{width:105px;font-size:12px;overflow:hidden;text-overflow:ellipsis}.bar>div{flex:1;background:#e9eef7;border-radius:8px;height:12px;overflow:hidden}.bar i{display:block;background:#5381eb;height:100%}footer{font-size:12px;color:#73809a;text-align:center;padding:15px}@media(max-width:500px){.value{font-size:20px}.wrap{padding:12px 12px 75px}.card{padding:14px}}

body{background:#f5f7fb}.tabs{position:sticky;top:0;background:#f5f7fb;z-index:2}.section-title{display:flex;align-items:center;justify-content:space-between;gap:8px}.status{font-size:12px;border-radius:20px;padding:5px 9px;background:#fff1c9;color:#795700}.status.paid{background:#dff7e9;color:#137047}.status.late{background:#ffe2e6;color:#b52d46}.mini{font-size:12px;color:#667}.stack{display:grid;gap:8px}.full{width:100%}button:disabled{opacity:.5} .hint{font-size:12px;color:#65728a;margin:8px 0} .row{flex-wrap:wrap}.row .actions{margin:0}</style></head><body><header><h1>💙 Meu Controle Financeiro</h1><div class="muted">Pessoal • Versão 2.2 • Dados neste navegador</div></header><main class="wrap"><nav class="tabs" id="tabs"></nav><section id="view"></section><footer>Gratuito • Dados locais • Exporte backups regularmente</footer></main><script>(()=>{'use strict';
const KEY='meu_financeiro_v2', $=s=>document.querySelector(s), money=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), num=v=>Math.round((Number(v)||0)*100)/100, id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8), iso=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`, month=s=>String(s||iso()).slice(0,7), fmt=s=>s?String(s).split('-').reverse().join('/'):'';
const defaults={expense:['🏠 Moradia','🛒 Alimentação','🚗 Transporte','🐶 Pets','💪 Academia e esportes','📱 Internet e telefone','💳 Cartão de crédito','🎮 Lazer','🛍️ Compras','📚 Educação','🩺 Saúde','📦 Outros'],income:['💵 Salário','💰 Renda extra','🛒 Vendas','🎁 Presentes','📈 Investimentos','💸 Outros']};
const initial=()=>({salary:0,payday:10,accounts:[],cards:[],transactions:[],recurring:[],goals:[],month:month(),categories:[],confirmations:{}});
let data;try{data=JSON.parse(localStorage.getItem(KEY))||initial()}catch{data=initial()}for(const [k,v] of Object.entries(initial()))if(data[k]===undefined)data[k]=v;
if(!Array.isArray(data.categories))data.categories=[];
if(!data.categories.length){for(const [type,names] of Object.entries(defaults))for(const name of names)data.categories.push({id:id(),name,type})}
// Older versions posted recurring entries automatically. Convert those entries into pending confirmations, without deducting balances.
for(const t of data.transactions){if(String(t.id).startsWith('rec-')&&!t.manualConfirmed){const parts=String(t.id).split('-');const ym=t.date?.slice(0,7);const rec=data.recurring.find(r=>String(t.id)===`rec-${r.id}-${ym}`);if(rec){data.confirmations[`${rec.id}:${ym}`]={status:'pending'};t._legacyRecurring=true}}}
data.transactions=data.transactions.filter(t=>!t._legacyRecurring);
for(const r of data.recurring){if(!r.type)r.type='expense';if(!r.start)r.start=month();}
let tab='inicio';function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('Armazenamento cheio. Exporte um backup.')}}save();
const v=k=>$('#'+k)?.value||'', amount=k=>{const n=Number(v(k));if(!Number.isFinite(n)||n<=0)throw Error('Informe um valor maior que zero.');return num(n)}, select=(items,empty='Selecione')=>`<option value="">${empty}</option>`+items.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join(''), fld=(label,html)=>`<div class="field"><label>${label}</label>${html}</div>`, inp=(key,type='text',placeholder='',attrs='')=>`<input id="${key}" type="${type}" placeholder="${placeholder}" ${attrs}>`, box=html=>`<article class="card">${html}</article>`, remove=(kind,key)=>`<button class="danger" data-del="${kind}" data-id="${esc(key)}">Excluir</button>`, line=(title,sub,side)=>`<div class="row"><div><strong>${title}</strong><small>${sub}</small></div><div>${side}</div></div>`, getCat=(type)=>data.categories.filter(c=>c.type===type), cats=(type)=>getCat(type).map(c=>`<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('');
const balance=key=>{const a=data.accounts.find(a=>a.id===key);if(!a)return 0;return num(Number(a.opening||0)+data.transactions.reduce((sum,t)=>sum+(t.account===key?(t.type==='income'?t.amount:['expense','transfer_out','card_payment'].includes(t.type)?-t.amount:t.type==='transfer_in'?t.amount:0):0),0))};
const monthly=()=>data.transactions.filter(t=>month(t.date)===data.month), total=(type)=>monthly().filter(t=>type==='expense'?['expense','card'].includes(t.type):t.type==='income').reduce((s,t)=>s+Number(t.amount||0),0);
function nextPay(){const now=new Date(),day=Math.max(1,Math.min(28,Number(data.payday)||10));let next=new Date(now.getFullYear(),now.getMonth(),day);if(next<=new Date(now.getFullYear(),now.getMonth(),now.getDate()))next=new Date(now.getFullYear(),now.getMonth()+1,day);const days=Math.max(1,Math.round((next-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/86400000));return {date:iso(next),days}}
const state=(r,ym)=>data.confirmations[`${r.id}:${ym}`]?.status==='paid'?'paid':`${ym}-${String(r.day).padStart(2,'0')}`<iso()?'late':'pending';
function dueItems(ym){return data.recurring.filter(r=>(r.start||ym)<=ym).map(r=>({r,ym,key:`${r.id}:${ym}`,date:`${ym}-${String(r.day).padStart(2,'0')}`,status:state(r,ym)}))}
function txForm(){return `<form id="txForm"><div class="form">${fld('Tipo',`<select id="txType"><option value="expense">Despesa</option><option value="income">Receita</option><option value="card">Compra no cartão</option><option value="transfer">Transferência</option><option value="card_payment">Pagamento de fatura</option></select>`)}${fld('Descrição',inp('txDesc','text','Ex.: Mercado','required'))}${fld('Valor (R$)',inp('txAmount','number','0,00','step="0.01" min="0.01" required'))}${fld('Data',inp('txDate','date','','required value="'+iso()+'"'))}${fld('Categoria',`<select id="txCategory">${cats('expense')}</select>`)}${fld('Conta',`<select id="txAccount">${select(data.accounts,'Sem conta')}</select>`)}${fld('Destino (transferência)',`<select id="txDest">${select(data.accounts)}</select>`)}${fld('Cartão',`<select id="txCard">${select(data.cards)}</select>`)}</div><div class="actions"><button class="primary">+ Registrar</button></div></form>`}
function txList(items){return items.length?items.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(t=>line(esc(t.desc),`${fmt(t.date)} • ${esc(t.category||t.type)}`,`<strong class="${t.type==='income'?'green':'red'}">${t.type==='income'?'+':'−'} ${money(t.amount)}</strong> ${remove('transactions',t.id)}`)).join(''):'<p class="muted">Nenhum lançamento.</p>'}
function home(){const pay=nextPay(),totalBank=data.accounts.reduce((s,a)=>s+balance(a.id),0),pending=dueItems(month()).filter(x=>x.status!=='paid'),fixedOut=pending.filter(x=>x.r.type==='expense').reduce((s,x)=>s+x.r.amount,0),reserve=data.goals.reduce((s,g)=>s+Number(g.monthly||0),0),available=Math.max(0,totalBank-fixedOut-reserve);return `<div class="section-title"><h2>🏠 Resumo financeiro</h2><input id="month" type="month" value="${data.month}" style="width:160px"></div><div class="grid">${box(`<div class="muted">Saldo bancário</div><div class="value blue">${money(totalBank)}</div>`)}${box(`<div class="muted">Receitas do mês</div><div class="value green">${money(total('income'))}</div>`)}${box(`<div class="muted">Despesas do mês</div><div class="value red">${money(total('expense'))}</div>`)}${box(`<div class="muted">Resultado do mês</div><div class="value">${money(total('income')-total('expense'))}</div>`)}</div>${box(`<h3>📅 Próximo salário: ${fmt(pay.date)}</h3><div class="muted">Recebimento dia ${data.payday} • ${pay.days} dias até o próximo pagamento</div><div class="value blue">${money(available/pay.days)} por dia</div><p class="hint">Estimativa = saldos cadastrados − despesas fixas pendentes deste mês − reservas planejadas, dividido pelos dias restantes. Não inclui dívidas futuras de cartão; confira antes de gastar.</p>`)}${box(`<h3>📆 Próximos compromissos</h3>${dueRows(dueItems(month()).filter(x=>x.status!=='paid').slice(0,6))}`)}${box(`<h3>⚡ Nova movimentação</h3>${txForm()}`)}${box(`<h3>Últimos lançamentos</h3>${txList(data.transactions.slice(-5))}`)}`}
function dueRows(items){return items.length?items.sort((a,b)=>a.date.localeCompare(b.date)).map(({r,ym,status})=>line(esc(r.name),`${fmt(`${ym}-${String(r.day).padStart(2,'0')}`)} • ${r.type==='income'?'Receita':'Despesa'} • <span class="status ${status}">${status==='paid'?'Confirmado':status==='late'?'Atrasado':'Pendente'}</span>`,`${money(r.amount)} ${status!=='paid'?`<button class="primary" data-confirm="${esc(r.id)}" data-ym="${ym}">Confirmar</button>`:''}`)).join(''):'<p class="muted">Nenhum compromisso pendente.</p>'}
function movements(){return `<h2>💸 Movimentações</h2>${box(txForm())}${box(`<h3>Histórico mensal</h3><input id="month" type="month" value="${data.month}" style="max-width:180px">${txList(monthly())}`)}`}
function categories(){return `<h2>🗂️ Categorias editáveis</h2>${box(`<form id="catForm"><div class="form">${fld('Tipo',`<select id="catType"><option value="expense">Despesa</option><option value="income">Receita</option></select>`)}${fld('Nome (pode incluir emoji)',inp('catName','text','Ex.: 🐶 Veterinário','required'))}</div><div class="actions"><button class="primary">Adicionar categoria</button></div></form>`)}${['expense','income'].map(type=>box(`<h3>${type==='expense'?'🔴 Despesas':'🟢 Receitas'}</h3>${getCat(type).map(c=>line(esc(c.name),'Categoria personalizada',`<button data-edit="category" data-id="${c.id}">Editar</button> ${remove('categories',c.id)}`)).join('')||'<p>Sem categorias.</p>'}`)).join('')}<p class="hint">Editar uma categoria também atualiza os lançamentos antigos que usam esse nome e tipo.</p>`}
function accounts(){return `<h2>🏦 Contas</h2>${box(`<form id="accountForm"><div class="form">${fld('Nome da conta',inp('aName','text','Ex.: Nubank','required'))}${fld('Saldo inicial',inp('aOpening','number','0,00','step="0.01" required'))}</div><div class="actions"><button class="primary">Adicionar conta</button></div></form>`)}${data.accounts.map(a=>box(line(esc(a.name),'Saldo atualizado',`<strong>${money(balance(a.id))}</strong> <button data-edit="account" data-id="${a.id}">Editar</button> ${remove('accounts',a.id)}`))).join('')}`}
function cards(){return `<h2>💳 Cartões</h2>${box(`<form id="cardForm"><div class="form">${fld('Nome',inp('cName','text','Ex.: Nubank','required'))}${fld('Limite total',inp('cLimit','number','0,00','min="0" step="0.01" required'))}${fld('Dia do fechamento',inp('cClose','number','1 a 28','min="1" max="28" required'))}${fld('Dia do vencimento',inp('cDue','number','1 a 28','min="1" max="28" required'))}</div><div class="actions"><button class="primary">Adicionar cartão</button></div></form>`)}${data.cards.map(c=>box(line(esc(c.name),`Fecha dia ${c.close} • Vence dia ${c.due} • Limite ${money(c.limit)}`,`<button data-edit="card" data-id="${c.id}">Editar</button> ${remove('cards',c.id)}`))).join('')}<div class="note">Compras no cartão são despesas na data da compra. Pagamento de fatura reduz a conta bancária sem gerar nova despesa. Parcelamento e cálculo de faturas ainda não são automáticos.</div>`}
function fixed(){return `<h2>🔁 Receitas e despesas fixas</h2><div class="note">Valores previstos não alteram o saldo. Você confirma cada pagamento ou recebimento quando acontecer.</div>${box(`<h3>Nova recorrência</h3><form id="recForm"><div class="form">${fld('Tipo',`<select id="rType"><option value="expense">Despesa fixa</option><option value="income">Receita fixa</option></select>`)}${fld('Descrição',inp('rName','text','Ex.: Internet ou salário','required'))}${fld('Valor mensal',inp('rAmount','number','0,00','min="0.01" step="0.01" required'))}${fld('Dia do mês',inp('rDay','number','1 a 28','min="1" max="28" required'))}${fld('Conta para confirmar',`<select id="rAccount">${select(data.accounts,'Escolher na confirmação')}</select>`)}</div><div class="actions"><button class="primary">Adicionar recorrência</button></div></form>`)}${box(`<h3>Cadastros</h3>${data.recurring.map(r=>line(esc(r.name),`${r.type==='income'?'Receita':'Despesa'} • Todo dia ${r.day}`,`${money(r.amount)} <button data-edit="recurring" data-id="${r.id}">Editar</button> ${remove('recurring',r.id)}`)).join('')||'<p class="muted">Nenhuma recorrência cadastrada.</p>'}`)}${box(`<h3>📅 Previsões de ${esc(data.month)}</h3><input type="month" id="month" value="${data.month}" style="max-width:180px">${dueRows(dueItems(data.month))}`)}`}
function goals(){return `<h2>🎯 Metas</h2>${box(`<form id="goalForm"><div class="form">${fld('Objetivo',inp('gName','text','Ex.: Reserva','required'))}${fld('Valor desejado',inp('gTarget','number','0,00','min="0.01" step="0.01" required'))}${fld('Já guardado',inp('gSaved','number','0,00','min="0" step="0.01" value="0" required'))}${fld('Reserva mensal',inp('gMonthly','number','0,00','min="0" step="0.01" value="0" required'))}${fld('Prazo',inp('gDeadline','date'))}</div><div class="actions"><button class="primary">Criar meta</button></div></form>`)}${data.goals.map(g=>{let p=Math.min(100,Math.round(100*g.saved/g.target));return box(`<h3>${esc(g.name)}</h3><p>${money(g.saved)} de ${money(g.target)} • ${p}%</p><div class="progress"><div style="width:${p}%"></div></div><p class="hint">Reserva mensal: ${money(g.monthly)} • Meta não movimenta conta bancária.</p><form class="goalAdd" data-id="${g.id}"><div class="actions"><input type="number" min="0.01" step="0.01" placeholder="Valor guardado" required style="max-width:160px"><button class="primary">Adicionar economia</button> ${remove('goals',g.id)}</div></form>`)}).join('')}`}
function reports(){let sums={};monthly().filter(t=>['expense','card'].includes(t.type)).forEach(t=>sums[t.category||'Outros']=(sums[t.category||'Outros']||0)+t.amount);let max=Math.max(1,...Object.values(sums));return `<h2>📊 Relatórios</h2>${box(`<h3>Gastos por categoria</h3><input type="month" id="month" value="${data.month}" style="max-width:180px">${Object.entries(sums).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<div class="bar"><span>${esc(k)}</span><div><i style="width:${100*n/max}%"></i></div><strong>${money(n)}</strong></div>`).join('')||'<p>Sem despesas neste mês.</p>'}`)}${box(`<h3>Resultado</h3><p>Receitas: ${money(total('income'))}</p><p>Despesas: ${money(total('expense'))}</p><strong>Diferença: ${money(total('income')-total('expense'))}</strong>`)}`}
function settings(){return `<h2>⚙️ Ajustes e backup</h2>${box(`<form id="settingsForm"><div class="form">${fld('Salário mensal (planejamento)',inp('salary','number','','min="0" step="0.01" value="'+data.salary+'" required'))}${fld('Dia do salário',inp('payday','number','','min="1" max="28" value="'+data.payday+'" required'))}</div><div class="actions"><button class="primary">Salvar</button></div></form><p class="hint">O salário informado não entra automaticamente no saldo. Cadastre uma receita fixa e confirme seu recebimento.</p>`)}${box(`<h3>💾 Backup</h3><div class="actions"><button class="primary" data-export="1">⬇ Exportar backup</button><label>⬆ Importar backup<input id="import" type="file" accept=".json,application/json"></label></div><p class="hint">O backup contém informações financeiras privadas. Não envie para o GitHub público. Importar substitui os dados atuais.</p>`)}${box(`<h3>🔒 Privacidade</h3><p>Os dados ficam neste navegador. Trocar de aparelho, limpar dados do navegador ou usar modo anônimo pode apagá-los. Faça backups frequentes.</p>`)}`}
const tabs=[['inicio','🏠 Início'],['movimentos','💸 Movimentações'],['categorias','🗂️ Categorias'],['contas','🏦 Contas'],['cartoes','💳 Cartões'],['fixas','🔁 Fixas'],['metas','🎯 Metas'],['relatorios','📊 Relatórios'],['config','⚙️ Ajustes']],pages={inicio:home,movimentos:movements,categorias:categories,contas:accounts,cartoes:cards,fixas:fixed,metas:goals,relatorios:reports,config:settings};function render(){ $('#tabs').innerHTML=tabs.map(([key,label])=>`<button class="tab ${key===tab?'active':''}" data-tab="${key}">${label}</button>`).join('');$('#view').innerHTML=pages[tab]();syncCategory()}
function syncCategory(){const sel=$('#txCategory'),type=v('txType');if(sel)sel.innerHTML=cats(type==='income'?'income':'expense')}
function confirmDue(key,ym){const r=data.recurring.find(r=>r.id===key);if(!r)return;const record=data.confirmations[`${key}:${ym}`];if(record?.status==='paid')return alert('Já confirmado.');const acc=prompt('Informe o nome EXATO da conta bancária para registrar (ou deixe vazio para registrar sem conta):',data.accounts.find(a=>a.id===r.account)?.name||'');if(acc===null)return;const account=acc.trim()?data.accounts.find(a=>a.name.toLowerCase()===acc.trim().toLowerCase())?.id:null;if(acc.trim()&&!account)return alert('Conta não encontrada. Confira o nome em Contas.');const date=prompt('Data real do pagamento/recebimento (AAAA-MM-DD):',iso());if(date===null)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||Number.isNaN(new Date(date+'T12:00:00').getTime()))return alert('Data inválida.');if(!confirm(`Confirmar ${r.type==='income'?'recebimento':'pagamento'} de ${money(r.amount)}?`))return;const txid=id();data.transactions.push({id:txid,type:r.type,desc:r.name,amount:Number(r.amount),date,account:account||'',category:r.category||(r.type==='income'?'💵 Salário':'🏠 Moradia'),recurringKey:`${key}:${ym}`});data.confirmations[`${key}:${ym}`]={status:'paid',txid};save();render()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render();return}if(b.dataset.confirm){confirmDue(b.dataset.confirm,b.dataset.ym);return}if(b.dataset.export){const blob=new Blob([JSON.stringify({version:21,exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`backup-financeiro-${iso()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);return}if(b.dataset.edit){const kind=b.dataset.edit,entry=(kind==='category'?data.categories:kind==='account'?data.accounts:kind==='card'?data.cards:data.recurring).find(x=>x.id===b.dataset.id);if(!entry)return;const name=prompt('Novo nome:',entry.name);if(name===null)return;if(!name.trim())return alert('Nome obrigatório.');if(kind==='category'){const old=entry.name;entry.name=name.trim();data.transactions.filter(t=>t.category===old&&(entry.type==='income'?t.type==='income':['expense','card'].includes(t.type))).forEach(t=>t.category=entry.name)}else{entry.name=name.trim();if(kind==='account'){const val=prompt('Saldo inicial:',entry.opening);if(val===null)return;if(!Number.isFinite(Number(val)))return alert('Valor inválido');entry.opening=num(val)}if(kind==='card'){for(const [key,label] of [['limit','Limite'],['close','Dia do fechamento'],['due','Dia do vencimento']]){const val=prompt(label,entry[key]);if(val===null)return;if(!Number.isFinite(Number(val)))return alert('Valor inválido');entry[key]=Number(val)}}if(kind==='recurring'){const value=prompt('Valor mensal:',entry.amount),day=prompt('Dia do mês (1 a 28):',entry.day);if(value===null||day===null)return;if(!Number.isFinite(Number(value))||Number(value)<=0||Number(day)<1||Number(day)>28)return alert('Valores inválidos');entry.amount=num(value);entry.day=Number(day)}}save();render();return}if(b.dataset.del){const kind=b.dataset.del,key=b.dataset.id;if(!confirm('Deseja excluir?'))return;if(kind==='accounts'&&data.transactions.some(t=>t.account===key))return alert('A conta possui movimentações. Não é possível excluir.');if(kind==='cards'&&data.transactions.some(t=>t.card===key))return alert('Cartão com lançamentos não pode ser excluído.');if(kind==='transactions'){const tx=data.transactions.find(t=>t.id===key);if(tx?.recurringKey)delete data.confirmations[tx.recurringKey];if(tx?.pair)data.transactions=data.transactions.filter(t=>t.pair!==tx.pair);else data.transactions=data.transactions.filter(t=>t.id!==key)}else data[kind]=data[kind].filter(x=>x.id!==key);save();render()}});
document.addEventListener('change',async e=>{if(e.target.id==='month'){data.month=e.target.value;save();render()}if(e.target.id==='txType')syncCategory();if(e.target.id==='import'){try{const f=e.target.files?.[0];if(!f)return;const raw=JSON.parse(await f.text()),d=raw.data;if(!d||!['transactions','accounts','cards','goals','recurring'].every(k=>Array.isArray(d[k])))throw Error('Backup incompatível');if(!confirm('Substituir TODOS os dados atuais pelo backup?'))return;data={...initial(),...d};if(!Array.isArray(data.categories)||!data.categories.length)data.categories=Object.entries(defaults).flatMap(([type,names])=>names.map(name=>({id:id(),type,name})));if(!data.confirmations)data.confirmations={};save();render();alert('Backup restaurado')}catch(err){alert('Falha ao importar: '+err.message)}}});
document.addEventListener('submit',e=>{const f=e.target;if(!['txForm','catForm','accountForm','cardForm','recForm','goalForm','settingsForm'].includes(f.id)&&!f.classList.contains('goalAdd'))return;e.preventDefault();try{if(f.id==='txForm'){const type=v('txType'),a=amount('txAmount'),desc=v('txDesc').trim(),date=v('txDate'),account=v('txAccount'),dest=v('txDest'),card=v('txCard');if(!desc)throw Error('Informe descrição.');if(type==='transfer'){if(!account||!dest||account===dest)throw Error('Escolha contas diferentes.');const pair=id();data.transactions.push({id:id(),pair,type:'transfer_out',desc,amount:a,date,account,category:'Transferência'},{id:id(),pair,type:'transfer_in',desc,amount:a,date,account:dest,category:'Transferência'})}else{if(type==='card'&&!card)throw Error('Selecione um cartão.');if(type==='card_payment'&&(!card||!account))throw Error('Selecione cartão e conta.');data.transactions.push({id:id(),type,desc,amount:a,date,account,card,category:v('txCategory')})}}else if(f.id==='catForm'){const name=v('catName').trim(),type=v('catType');if(!name)throw Error('Nome obrigatório');if(data.categories.some(c=>c.type===type&&c.name.toLowerCase()===name.toLowerCase()))throw Error('Categoria já existe');data.categories.push({id:id(),name,type})}else if(f.id==='accountForm'){data.accounts.push({id:id(),name:v('aName').trim(),opening:Number(v('aOpening'))||0})}else if(f.id==='cardForm'){data.cards.push({id:id(),name:v('cName').trim(),limit:amount('cLimit'),close:Number(v('cClose')),due:Number(v('cDue'))})}else if(f.id==='recForm'){data.recurring.push({id:id(),name:v('rName').trim(),type:v('rType'),amount:amount('rAmount'),day:Number(v('rDay')),account:v('rAccount'),start:month()})}else if(f.id==='goalForm'){data.goals.push({id:id(),name:v('gName').trim(),target:amount('gTarget'),saved:num(v('gSaved')),monthly:num(v('gMonthly')),deadline:v('gDeadline')})}else if(f.id==='settingsForm'){data.salary=num(v('salary'));data.payday=Number(v('payday'))}else if(f.classList.contains('goalAdd')){const g=data.goals.find(g=>g.id===f.dataset.id),n=Number(f.querySelector('input').value);if(!g||!Number.isFinite(n)||n<=0)throw Error('Valor inválido');g.saved=num(g.saved+n)}save();render()}catch(err){alert(err.message)}});
render();
})();
</script></body></html>
